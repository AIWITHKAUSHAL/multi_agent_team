<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
  <title id="title">Dynamic multi-agent architecture</title>
  <desc id="desc">A supervisor dynamically routes work among research, developer, reviewer and report agents, which communicate through shared state.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
  <rect width="1000" height="610" rx="18" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="390" y="35" width="220" height="65" rx="14" fill="#1d4ed8"/><text x="500" y="75" font-size="22" fill="white">User Task</text>
    <path d="M500 100 V140" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <polygon points="500,140 635,210 500,280 365,210" fill="#7c3aed"/><text x="500" y="204" font-size="22" fill="white">Supervisor</text><text x="500" y="231" font-size="15" fill="white">dynamic routing</text>
    <rect x="45" y="335" width="190" height="70" rx="12" fill="#0891b2"/><text x="140" y="377" font-size="19" fill="white">Research Agent</text>
    <rect x="275" y="335" width="190" height="70" rx="12" fill="#0891b2"/><text x="370" y="377" font-size="19" fill="white">Developer Agent</text>
    <rect x="535" y="335" width="190" height="70" rx="12" fill="#0891b2"/><text x="630" y="377" font-size="19" fill="white">Reviewer Agent</text>
    <rect x="765" y="335" width="190" height="70" rx="12" fill="#0891b2"/><text x="860" y="377" font-size="19" fill="white">Report Agent</text>
    <g stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)" fill="none"><path d="M410 255 L160 330"/><path d="M465 275 L380 330"/><path d="M535 275 L620 330"/><path d="M590 255 L840 330"/></g>
    <path d="M630 335 C630 295 425 295 400 335" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="515" y="302" font-size="14" fill="#b91c1c">rejection / revision loop</text>
    <rect x="275" y="485" width="450" height="80" rx="18" fill="#0f172a"/><text x="500" y="520" font-size="22" fill="white">Shared State</text><text x="500" y="548" font-size="15" fill="#cbd5e1">research · solution · review · final report · event history</text>
    <g stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" fill="none"><path d="M140 405 L330 485"/><path d="M370 405 L430 485"/><path d="M630 405 L570 485"/><path d="M860 405 L670 485"/><path d="M500 280 V485"/></g>
  </g>
</svg>
