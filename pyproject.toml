[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-multi-agent-team"
version = "1.0.0"
description = "A dynamically routed, shared-state multi-agent workflow using Gemini 3.5 Flash-Lite"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.10.0",
  "rich>=13.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
multi-agent = "multi_agent_team.cli:main"

[tool.setuptools.packages.find]
include = ["multi_agent_team*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

